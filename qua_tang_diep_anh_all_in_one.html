    <title>Gửi Diệp Anh ♥ - Bản Chạy Ngay (All-in-One)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- PHẦN 1: GIAO DIỆN & HIỆU ỨNG (style.css)   -->

    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #030106;
    background-image: radial-gradient(circle at 50% 42%, #1a0626 0%, #09020f 48%, #020004 100%);
    font-family: 'Quicksand', 'Segoe UI', Roboto, sans-serif;
}

#canvas-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

/* Chữ Diệp Anh ở giữa trái tim */
#center-name-overlay {
    position: fixed;
    top: 39%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.75);
    z-index: 5;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.2s cubic-bezier(0.22, 1, 0.36, 1), transform 2.2s cubic-bezier(0.22, 1, 0.36, 1);
}

#center-name-overlay.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    animation: floatingPulse 2.8s ease-in-out infinite alternate;
}

.main-name {
    font-family: 'Dancing Script', 'Brush Script MT', cursive;
    font-size: clamp(2.4rem, 5.5vw, 4.2rem);
    font-weight: 700;
    color: #ffffff;
    text-shadow:
        0 0 8px #fff,
        0 0 16px #ff66b3,
        0 0 30px #ff1a8c,
        0 0 55px #b30086,
        0 0 90px #800060;
    letter-spacing: 2px;
    white-space: nowrap;
}

.sub-name {
    margin-top: 6px;
    font-size: clamp(0.75rem, 1.8vw, 1.05rem);
    color: #ffcce6;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 10px #ff4da6, 0 0 20px #cc33ff;
    opacity: 0.92;
}

@keyframes floatingPulse {
    0% {
        transform: translate(-50%, -50%) scale(0.96);
        filter: drop-shadow(0 0 12px rgba(255, 77, 166, 0.65));
    }
    100% {
        transform: translate(-50%, -52%) scale(1.05);
        filter: drop-shadow(0 0 26px rgba(255, 128, 213, 0.95));
    }
}

/* Nút điều khiển nhỏ gọn ở góc */
#ui-controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 10;
    display: flex;
    gap: 10px;
}

.control-btn {
    background: rgba(255, 77, 166, 0.18);
    border: 1px solid rgba(255, 153, 204, 0.45);
    color: #ffe6f2;
    padding: 8px 15px;
    border-radius: 25px;
    font-size: 13px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.25s ease;
    box-shadow: 0 0 15px rgba(255, 77, 166, 0.25);
}

.control-btn:hover {
    background: rgba(255, 77, 166, 0.4);
    transform: translateY(-2px);
    box-shadow: 0 0 22px rgba(255, 77, 166, 0.6);
}

#hint-text {
    position: fixed;
    bottom: 18px;
    left: 22px;
    z-index: 10;
    color: rgba(255, 194, 224, 0.55);
    font-size: 12px;
    pointer-events: none;
    letter-spacing: 0.5px;
}

    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="center-name-overlay">
        <div class="main-name" id="main-name-text">Diệp Anh</div>
        <div class="sub-name" id="sub-name-text">♥ Love You Forever ♥</div>
    </div>

    <div id="hint-text">✨ Chạm và xoay để ngắm 3D</div>

    <div id="ui-controls">
        <button class="control-btn" id="btn-replay">🔄 Cuộn hạt lại</button>
        <button class="control-btn" id="btn-music" style="display: none;">🔈 Bật nhạc</button>
    </div>

    <audio id="bg-music" loop></audio>

    <script>
// ==========================================
// FILE CẤU HÌNH CÁ NHÂN HÓA (DỄ DÀNG CHỈNH SỬA)
// ==========================================

const CONFIG = {
    // 1. Tên người thương hiển thị ở giữa trái tim
    centerName: "Diệp Anh",
    centerSubText: "♥ Love You Forever ♥",
    
    // 2. Thời điểm hiện chữ ở giữa trái tim (tính bằng giây sau khi các hạt cuộn từ dưới lên)
    nameAppearDelay: 1.8,

    // 3. Danh sách các câu chữ xoay quanh đĩa tròn dưới đáy (giống 100% video mẫu)
    ringMessages: [
        "Cho anh làm bạn trai của em nhé ♥",
        "Anh đã thích em từ cái nhìn đầu tiên",
        "Anh muốn được yêu và chăm sóc em",
        "Nơi nào có hai ta chắc chắn là thiên đường",
        "Anh yêu em nhiều lắm Diệp Anh ơi ♥",
        "Mãi bên nhau em nhé ♥ Love You"
    ],

    // 4. Bảng màu hạt li ti (Trái tim hồng tím & các hạt lấp lánh dưới đáy)
    colors: {
        heartPrimary: "#ff4da6",      // Hồng đậm chủ đạo
        heartSecondary: "#d966ff",    // Tím hồng mộng mơ
        heartHighlight: "#ffb3d9",    // Hồng phấn sáng lấp lánh
        heartCore: "#ffffff",         // Ánh sáng trắng tâm điểm
        diskSparkles: [               // Màu các hạt lấp lánh dưới vòng tròn chữ
            "#ff66b3",
            "#cc66ff",
            "#ff99cc",
            "#ffd700",
            "#66ccff",
            "#ffffff"
        ]
    },

    // 5. Cấu hình số lượng hạt và tốc độ chuyển động
    particles: {
        heartCount: 16000,            // Số lượng hạt li ti tạo nên trái tim 3D
        risingStreamCount: 900,       // Số lượng hạt cuộn xoáy từ đáy lên đỉnh tim
        diskSparkleCount: 1800,       // Số lượng hạt bụi sao lấp lánh ở đĩa dưới
        heartbeatSpeed: 2.2,          // Tốc độ nhịp đập của trái tim
        diskRotationSpeed: 0.35       // Tốc độ xoay của các vòng chữ dưới đáy
    },

    // 6. Link nhạc nền (Bỏ file mp3 vào cùng thư mục và điền tên file vào đây, ví dụ: "nhac.mp3")
    musicUrl: ""
};

    <!-- ========================================== -->
    <!-- PHẦN 3: TRÁI TIM 3D & HẠT CUỘN (heart.js)  -->
    <!-- ========================================== -->
    <script>
// ==========================================
// MODULE TẠO KHỐI TRÁI TIM 3D & HẠT CUỘN TỪ DƯỚI LÊN
// ==========================================

// Hàm toán học chuẩn tạo hình dáng trái tim 3D căng tròn như trong video
function sampleHeartPosition(scale = 11.5) {
    // Sử dụng phân phối tập trung nhiều ở lớp vỏ ngoài và tỏa nhẹ vào tâm
    const u = Math.random() * Math.PI * 2;
    const v = Math.random() * Math.PI;
    
    // Tạo độ dày lớp vỏ để trái tim vừa rõ khối 3D vừa có chiều sâu hạt li ti
    const shellBias = Math.pow(Math.random(), 0.28); 
    
    const x = 16 * Math.pow(Math.sin(u), 3) * Math.sin(v);
    const y = (13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u)) * Math.sin(v);
    const z = 9.5 * Math.cos(v);

    return {
        x: (x / 16) * scale * shellBias,
        y: (y / 16) * scale * shellBias + 3.2, // Nâng tim lên phía trên đĩa chữ
        z: (z / 16) * scale * shellBias
    };
}

// Tạo texture hạt phát sáng mềm mại
function createGlowDotTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.25, 'rgba(255, 190, 235, 0.9)');
    grad.addColorStop(0.55, 'rgba(230, 80, 185, 0.45)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 64, 64);

    const texture = new THREE.CanvasTexture(canvas);
    return texture;
}

class HeartParticleSystem {
    constructor(scene, dotTexture) {
        this.scene = scene;
        this.dotTexture = dotTexture;
        this.count = CONFIG.particles.heartCount;
        this.streamCount = CONFIG.particles.risingStreamCount;
        this.time = 0;

        this.initHeartParticles();
        this.initRisingStream();
    }

    initHeartParticles() {
        this.geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(this.count * 3);
        const targetPositions = new Float32Array(this.count * 3);
        const startPositions = new Float32Array(this.count * 3);
        const delays = new Float32Array(this.count);
        const colors = new Float32Array(this.count * 3);
        const sizes = new Float32Array(this.count);

        const cPrimary = new THREE.Color(CONFIG.colors.heartPrimary);
        const cSecondary = new THREE.Color(CONFIG.colors.heartSecondary);
        const cHighlight = new THREE.Color(CONFIG.colors.heartHighlight);
        const cCore = new THREE.Color(CONFIG.colors.heartCore);

        for (let i = 0; i < this.count; i++) {
            const target = sampleHeartPosition(11.8);
            targetPositions[i * 3] = target.x;
            targetPositions[i * 3 + 1] = target.y;
            targetPositions[i * 3 + 2] = target.z;

            // Điểm xuất phát từ đĩa tròn bên dưới để cuộn xoáy lên thành trái tim
            const angle = Math.random() * Math.PI * 2;
            const radius = 0.6 + Math.random() * 11.5;
            startPositions[i * 3] = Math.cos(angle) * radius;
            startPositions[i * 3 + 1] = -11.5 - Math.random() * 2.5;
            startPositions[i * 3 + 2] = Math.sin(angle) * radius;

            positions[i * 3] = startPositions[i * 3];
            positions[i * 3 + 1] = startPositions[i * 3 + 1];
            positions[i * 3 + 2] = startPositions[i * 3 + 2];

            // Độ trễ để các hạt cuộn dần từ dưới lên
            delays[i] = Math.random() * 2.2;

            // Phối màu hồng - tím - trắng y hệt video
            const mixRatio = Math.random();
            let finalColor = new THREE.Color();
            if (mixRatio < 0.48) {
                finalColor.copy(cPrimary).lerp(cSecondary, Math.random());
            } else if (mixRatio < 0.88) {
                finalColor.copy(cSecondary).lerp(cHighlight, Math.random());
            } else {
                finalColor.copy(cCore);
            }

            colors[i * 3] = finalColor.r;
            colors[i * 3 + 1] = finalColor.g;
            colors[i * 3 + 2] = finalColor.b;

            sizes[i] = 0.14 + Math.random() * 0.24;
        }

        this.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        this.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        this.geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        this.targetPositions = targetPositions;
        this.startPositions = startPositions;
        this.delays = delays;

        const material = new THREE.PointsMaterial({
            size: 0.26,
            map: this.dotTexture,
            vertexColors: true,
            transparent: true,
            opacity: 0.92,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        this.points = new THREE.Points(this.geometry, material);
        this.scene.add(this.points);
    }

    // Luồng hạt li ti liên tục bay từ tâm đĩa tròn dưới đáy cuộn lên đáy trái tim
    initRisingStream() {
        this.streamGeo = new THREE.BufferGeometry();
        const pos = new Float32Array(this.streamCount * 3);
        const col = new Float32Array(this.streamCount * 3);
        this.streamData = [];

        const palette = CONFIG.colors.diskSparkles.map(c => new THREE.Color(c));

        for (let i = 0; i < this.streamCount; i++) {
            const progress = Math.random();
            const angle = Math.random() * Math.PI * 2;
            const baseRadius = 0.2 + Math.random() * 4.2;

            this.streamData.push({
                progress: progress,
                speed: 0.22 + Math.random() * 0.35,
                angle: angle,
                baseRadius: baseRadius,
                swirlSpeed: (Math.random() - 0.5) * 2.5,
                targetX: (Math.random() - 0.5) * 5.0,
                targetZ: (Math.random() - 0.5) * 3.5
            });

            const c = palette[Math.floor(Math.random() * palette.length)];
            col[i * 3] = c.r;
            col[i * 3 + 1] = c.g;
            col[i * 3 + 2] = c.b;
        }

        this.streamGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        this.streamGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));

        const streamMat = new THREE.PointsMaterial({
            size: 0.32,
            map: this.dotTexture,
            vertexColors: true,
            transparent: true,
            opacity: 0.88,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        this.streamPoints = new THREE.Points(this.streamGeo, streamMat);
        this.scene.add(this.streamPoints);
    }

    resetRiseAnimation() {
        this.time = 0;
        const overlay = document.getElementById('center-name-overlay');
        if (overlay) overlay.classList.remove('visible');
    }

    update(dt) {
        this.time += dt;

        // Hiển thị chữ "Diệp Anh" ở giữa trái tim khi các hạt cuộn từ dưới lên
        const overlay = document.getElementById('center-name-overlay');
        if (overlay && this.time >= CONFIG.nameAppearDelay && !overlay.classList.contains('visible')) {
            overlay.classList.add('visible');
        }

        // Nhịp đập tự nhiên của trái tim
        const beat = 1 + 0.045 * Math.sin(this.time * CONFIG.particles.heartbeatSpeed * Math.PI)
                       + 0.02 * Math.sin(this.time * CONFIG.particles.heartbeatSpeed * Math.PI * 2);

        const posAttr = this.geometry.attributes.position;
        const posArr = posAttr.array;

        for (let i = 0; i < this.count; i++) {
            const idx = i * 3;
            const localTime = Math.max(0, this.time - this.delays[i]);
            // Quá trình hạt cuộn từ đáy lên vị trí trên trái tim mất khoảng 2.4 giây
            const duration = 2.4;
            let t = Math.min(1, localTime / duration);

            // Ease-out mượt mà
            const ease = 1 - Math.pow(1 - t, 3);

            // Hiệu ứng xoáy nhẹ khi cuộn từ dưới lên
            const swirlAngle = (1 - ease) * 4.2;
            const sx = this.startPositions[idx] * Math.cos(swirlAngle) - this.startPositions[idx + 2] * Math.sin(swirlAngle);
            const sz = this.startPositions[idx] * Math.sin(swirlAngle) + this.startPositions[idx + 2] * Math.cos(swirlAngle);
            const sy = this.startPositions[idx + 1];

            // Khi đã vào form trái tim thì đập nhẹ và lấp lánh
            const tx = this.targetPositions[idx] * beat;
            const ty = (this.targetPositions[idx + 1] - 3.2) * beat + 3.2;
            const tz = this.targetPositions[idx + 2] * beat;

            // Dao động li ti tại chỗ
            const shimmerX = Math.sin(this.time * 2.5 + i) * 0.05 * ease;
            const shimmerY = Math.cos(this.time * 2.2 + i * 0.5) * 0.05 * ease;

            posArr[idx] = sx + (tx - sx) * ease + shimmerX;
            posArr[idx + 1] = sy + (ty - sy) * ease + shimmerY;
            posArr[idx + 2] = sz + (tz - sz) * ease;
        }
        posAttr.needsUpdate = true;

        // Xoay nhẹ khối trái tim để tạo cảm giác 3D sống động như video
        this.points.rotation.y = Math.sin(this.time * 0.45) * 0.22;

        // Cập nhật luồng hạt bay liên tục từ đĩa tròn dưới lên đáy và tâm trái tim
        const sAttr = this.streamGeo.attributes.position;
        const sArr = sAttr.array;

        for (let i = 0; i < this.streamCount; i++) {
            const d = this.streamData[i];
            d.progress += dt * d.speed;
            if (d.progress > 1) {
                d.progress = 0;
            }

            const p = d.progress;
            const currentAngle = d.angle + p * d.swirlSpeed * Math.PI;
            // Thu hẹp dần khi chạm vào chóp dưới trái tim rồi tỏa lên tâm tim
            const funnel = (1 - p) * d.baseRadius + p * 0.8;

            const x = Math.cos(currentAngle) * funnel * (1 - p * 0.5) + d.targetX * p;
            const z = Math.sin(currentAngle) * funnel * (1 - p * 0.5) + d.targetZ * p;
            // Bay từ đáy (-11.5) lên giữa trái tim (+3.5)
            const y = -11.5 + p * 15.2;

            sArr[i * 3] = x;
            sArr[i * 3 + 1] = y;
            sArr[i * 3 + 2] = z;
        }
        sAttr.needsUpdate = true;
    }
}

    </script>

    <!-- PHẦN 4: VÒNG CHỮ ĐÁY XOAY (textRing.js)    -->
    <!-- ========================================== -->
    <script>
// ==========================================
// MODULE VÒNG TRÒN CHỮ XOAY & HẠT LẤP LÁNH DƯỚI ĐÁY
// ==========================================

class TextDiskSystem {
    constructor(scene, dotTexture) {
        this.scene = scene;
        this.dotTexture = dotTexture;
        this.group = new THREE.Group();
        this.group.position.set(0, -11.5, 0);
        // Nghiêng nhẹ góc nhìn để thấy rõ các vòng chữ đồng tâm như trong video TikTok
        this.group.rotation.x = 0.12;
        this.scene.add(this.group);

        this.ringMeshes = [];
        this.initTextRings();
        this.initDiskSparkles();
    }

    // Vẽ chữ cong theo đường tròn bằng Canvas 2D độ phân giải cao
    createRingTexture(text, radiusPx, fontSize, glowColor) {
        const size = 1024;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        const center = size / 2;
        ctx.clearRect(0, 0, size, size);

        // Vẽ đường viền phát sáng mảnh giống video
        ctx.beginPath();
        ctx.arc(center, center, radiusPx, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 140, 210, 0.16)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.save();
        ctx.font = `600 ${fontSize}px "Quicksand", "Segoe UI", sans-serif`;
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 10;

        // Lặp câu chữ 2 lần quanh vòng tròn để nhìn góc nào cũng đầy đặn
        const repeatedText = `${text}   •   ${text}   •   `;
        const chars = Array.from(repeatedText);
        const angleStep = (Math.PI * 2) / chars.length;

        for (let i = 0; i < chars.length; i++) {
            const angle = i * angleStep;
            ctx.save();
            ctx.translate(
                center + Math.cos(angle) * radiusPx,
                center + Math.sin(angle) * radiusPx
            );
            ctx.rotate(angle + Math.PI / 2);
            ctx.fillText(chars[i], 0, 0);
            ctx.restore();
        }

        ctx.restore();

        const texture = new THREE.CanvasTexture(canvas);
        texture.anisotropy = 4;
        return texture;
    }

    initTextRings() {
        const messages = CONFIG.ringMessages;
        const totalRings = messages.length;

        for (let i = 0; i < totalRings; i++) {
            const worldSize = 11.5 + i * 3.4;
            const texture = this.createRingTexture(
                messages[i],
                390,
                34,
                i % 2 === 0 ? '#ff4da6' : '#cc66ff'
            );

            const geometry = new THREE.PlaneGeometry(worldSize, worldSize);
            const material = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                opacity: 0.92,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.y = i * 0.02;

            this.group.add(mesh);
            this.ringMeshes.push({
                mesh: mesh,
                // Các vòng xoay ngược chiều hoặc khác tốc độ nhẹ tạo chiều sâu
                speed: (i % 2 === 0 ? 1 : -0.75) * CONFIG.particles.diskRotationSpeed * (1 - i * 0.08)
            });
        }
    }

    // Các hạt bụi sao nhiều màu sắc xoay quanh các vòng chữ dưới đáy
    initDiskSparkles() {
        const count = CONFIG.particles.diskSparkleCount;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);

        const palette = CONFIG.colors.diskSparkles.map(c => new THREE.Color(c));

        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 1.2 + Math.pow(Math.random(), 0.85) * 14.5;
            const heightOffset = (Math.random() - 0.5) * 1.4;

            pos[i * 3] = Math.cos(angle) * radius;
            pos[i * 3 + 1] = heightOffset;
            pos[i * 3 + 2] = Math.sin(angle) * radius;

            const c = palette[Math.floor(Math.random() * palette.length)];
            col[i * 3] = c.r;
            col[i * 3 + 1] = c.g;
            col[i * 3 + 2] = c.b;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

        const mat = new THREE.PointsMaterial({
            size: 0.34,
            map: this.dotTexture,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        this.diskSparkles = new THREE.Points(geo, mat);
        this.group.add(this.diskSparkles);
    }

    update(dt) {
        for (let item of this.ringMeshes) {
            item.mesh.rotation.z += item.speed * dt;
        }
        if (this.diskSparkles) {
            this.diskSparkles.rotation.y -= CONFIG.particles.diskRotationSpeed * 0.8 * dt;
        }
    }
}

    </script>

    <!-- PHẦN 5: KHỞI TẠO & ĐIỀU KHIỂN (main.js)    -->
    <!-- ========================================== -->
    <script>
// ==========================================
// FILE ĐIỀU KHIỂN CHÍNH (SCENE 3D, CAMERA & ANIMATION)
// ==========================================

let scene, camera, renderer, clock;
let heartSystem, textDiskSystem;
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let targetRotation = { x: 0.18, y: 0 };
let currentRotation = { x: 0.18, y: 0 };

function initApp() {
    // 1. Gán chữ cá nhân hóa từ CONFIG vào giao diện
    const mainNameEl = document.getElementById('main-name-text');
    const subNameEl = document.getElementById('sub-name-text');
    if (mainNameEl) mainNameEl.textContent = CONFIG.centerName;
    if (subNameEl) subNameEl.textContent = CONFIG.centerSubText;

    // 2. Khởi tạo Three.js Scene
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        48,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    // Đặt vị trí camera nhìn toàn cảnh cả trái tim trên và đĩa chữ dưới
    updateCameraResponsive();

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    clock = new THREE.Clock();

    // 3. Khởi tạo các hệ thống hạt trái tim & vòng chữ
    const dotTexture = createGlowDotTexture();
    this.worldGroup = new THREE.Group();
    scene.add(this.worldGroup);

    heartSystem = new HeartParticleSystem(this.worldGroup, dotTexture);
    textDiskSystem = new TextDiskSystem(this.worldGroup, dotTexture);

    // 4. Sự kiện xoay góc nhìn bằng chuột hoặc vuốt tay trên điện thoại
    setupInteractions();

    // 5. Bắt đầu vòng lặp chuyển động
    animate();
}

function updateCameraResponsive() {
    const aspect = window.innerWidth / window.innerHeight;
    if (aspect < 0.75) {
        // Màn hình dọc (Điện thoại giống TikTok)
        camera.position.set(0, 1.5, 44);
    } else {
        // Màn hình ngang (Máy tính / Tablet)
        camera.position.set(0, 1.0, 34);
    }
    camera.lookAt(0, -2.0, 0);
}

function setupInteractions() {
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        updateCameraResponsive();
    });

    window.addEventListener('pointerdown', (e) => {
        isDragging = true;
        prevMouse.x = e.clientX;
        prevMouse.y = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = (e.clientX - prevMouse.x) * 0.005;
        const dy = (e.clientY - prevMouse.y) * 0.005;
        targetRotation.y += dx;
        targetRotation.x = Math.max(-0.35, Math.min(0.65, targetRotation.x + dy));
        prevMouse.x = e.clientX;
        prevMouse.y = e.clientY;
    });

    window.addEventListener('pointerup', () => {
        isDragging = false;
    });

    // Nút phát lại hiệu ứng hạt cuộn từ dưới lên
    const replayBtn = document.getElementById('btn-replay');
    if (replayBtn) {
        replayBtn.addEventListener('click', () => {
            if (heartSystem) heartSystem.resetRiseAnimation();
        });
    }

    // Nút nhạc nền (nếu người dùng cấu hình file nhạc trong config.js)
    const musicBtn = document.getElementById('btn-music');
    const audioEl = document.getElementById('bg-music');
    if (CONFIG.musicUrl && audioEl && musicBtn) {
        audioEl.src = CONFIG.musicUrl;
        musicBtn.style.display = 'inline-block';
        musicBtn.addEventListener('click', () => {
            if (audioEl.paused) {
                audioEl.play();
                musicBtn.textContent = '🔊 Đang phát nhạc';
            } else {
                audioEl.pause();
                musicBtn.textContent = '🔈 Bật nhạc';
            }
        });
    }
}

function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.05);

    // Làm mượt chuyển động xoay
    currentRotation.x += (targetRotation.x - currentRotation.x) * 0.08;
    currentRotation.y += (targetRotation.y - currentRotation.y) * 0.08;

    if (this.worldGroup) {
        this.worldGroup.rotation.x = currentRotation.x;
        this.worldGroup.rotation.y = currentRotation.y;
    }

    if (heartSystem) heartSystem.update(dt);
    if (textDiskSystem) textDiskSystem.update(dt);

    renderer.render(scene, camera);
}

window.addEventListener('DOMContentLoaded', initApp);

    </script>
